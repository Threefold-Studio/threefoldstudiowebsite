<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threefold Studio, Links</title>
<meta name="description" content="Find Threefold Studio everywhere: website, X, Instagram, TikTok, and Reddit.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Threefold Studio, Links">
<meta property="og:description" content="Find Threefold Studio everywhere.">
<meta property="og:image" content="https://threefoldstudio.co/social-share.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10192B;
    --amber: #E8A33D;
    --amber-deep: #C9832A;
    --cord: #B98B56;
    --slate-dim: #8B93A0;
    --paper: #FCFAF6;
    --card: #1B2740;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    min-height:100%;
    font-family:'Inter', -apple-system, sans-serif;
    background:var(--ink);
    color:var(--paper);
  }
  body{
    display:flex;
    justify-content:center;
    padding:64px 24px;
  }
  .wrap{
    max-width:420px;
    width:100%;
    text-align:center;
  }
  .cord-mark{
    width:60px;
    height:35px;
    margin-bottom:20px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:0.72rem;
    color:var(--cord);
    display:block;
    margin-bottom:10px;
  }
  h1{
    font-family:'Spectral', Georgia, serif;
    font-weight:600;
    font-size:1.6rem;
    margin:0 0 6px;
    color:var(--paper);
  }
  p.tagline{
    font-size:0.95rem;
    color:var(--slate-dim);
    margin:0 0 36px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:16px 20px;
    text-decoration:none;
    color:var(--paper);
    font-weight:600;
    font-size:1rem;
    transition:border-color 0.2s ease, transform 0.15s ease;
  }
  .link-btn:hover,
  .link-btn:focus-visible{
    border-color:var(--amber);
    transform:translateY(-1px);
  }
  .link-btn .icon{
    width:22px;
    height:22px;
    flex-shrink:0;
    color:var(--amber);
  }
  .link-btn .handle{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    color:var(--slate-dim);
    font-weight:400;
  }
  footer{
    margin-top:44px;
    font-size:0.78rem;
    color:var(--slate-dim);
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="cord-mark" viewBox="0 0 34 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin-left:auto;margin-right:auto;display:block;">

      <path d="M1 10 Q 9 18, 17 10 T 33 10" stroke="#B98B56" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M1 10 L 33 10" stroke="#F5EFE3" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </svg>
    <span class="eyebrow">Threefold Studio</span>

    <div class="links">

        X
        <span class="handle">@threefoldapps</span>

        Instagram
        <span class="handle">@threefoldapps</span>

        TikTok
        <span class="handle">@threefoldapps</span>
      </a>

      <a class="link-btn" href="https://reddit.com/u/threefoldapps" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="8.5" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="13" r="1.2" fill="currentColor" stroke="none"/><path d="M8 16.5c1 .8 2.3 1.2 4 1.2s3-.4 4-1.2"/></svg>
        Reddit
        <span class="handle">u/threefoldapps</span>

    </div>

    <footer>
      hello@threefoldstudio.co
      <div style="margin-top:10px; font-size:0.8rem;">
        <a href="/privacy" style="color:inherit;">Threefold Studio Privacy Policy</a> &nbsp;·&nbsp; <a href="/terms" style="color:inherit;">Threefold Studio Terms of Service</a>

    </footer>
  </div>
</body>
</html>
